---
- name: Installazione Docker e Container
  hosts: localhost
  become: true
  vars:
    # Configurazione Rete Docker
    docker_network_name: "jenkins_network"
    docker_network_subnet: "172.28.0.0/16"
    docker_network_gateway: "172.28.0.1"

    # Configurazione Jenkins Master
    jenkins_master_name: "jenkins-master"
    jenkins_master_ip: "172.28.0.10"
    jenkins_master_image: "jenkins/jenkins:lts-jdk17"

    # Configurazione Jenkins Agent
    jenkins_agent_name: "jenkins-agent"
    jenkins_agent_ip: "172.28.0.20"
    jenkins_agent_image: "jenkins/inbound-agent:latest"
    jenkins_agent_secret: "*"

  tasks:

    # DOCKER SU ROCKY LINUX 
    - name: Rimozione pacchetti Docker legacy
      ansible.builtin.dnf:
        name:
          - docker
          - docker-client
          - docker-client-latest
          - docker-common
          - docker-latest
          - docker-latest-logrotate
          - docker-logrotate
          - docker-engine
        state: absent

    - name: Installazione dnf-plugins-core e dipendenze Python
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - python3-pip
          - python3-devel
        state: present

    - name: Rimozione pacchetti RPM conflittuali
      ansible.builtin.dnf:
        name:
          - python3-requests
          - python3-urllib3
        state: absent

    - name: Aggiornamento pip e setuptools
      ansible.builtin.pip:
        name:
          - pip
          - setuptools
        state: latest

    - name: Installazione librerie Python per Docker 
      ansible.builtin.pip:
        name:
          - "urllib3<2.0.0"
          - "requests<2.29.0"
          - "docker>=6.1.0"
        state: present

    - name: Repository Docker CE
      ansible.builtin.command:
        cmd: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Installazione Docker Engine
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Avvio ed abilitazione Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # CONFIGURAZIONE DOCKER NETWORK
    - name: Creazione Rete Docker 
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        driver: bridge
        ipam_config:
          - subnet: "{{ docker_network_subnet }}"
            gateway: "{{ docker_network_gateway }}"
        state: present

    # JENKINS MASTER
    - name: Creazione Volume per Jenkins Master
      community.docker.docker_volume:
        name: jenkins_home_data
        state: present

    - name: Avvio container Jenkins Master
      community.docker.docker_container:
        name: "{{ jenkins_master_name }}"
        image: "{{ jenkins_master_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "8080:8080" 
          - "50000:50000" 
        volumes:
          - jenkins_home_data:/var/jenkins_home
        networks:
          - name: "{{ docker_network_name }}"
            ipv4_address: "{{ jenkins_master_ip }}"

    - name: Recupero della password 
      ansible.builtin.command:
        cmd: docker exec {{ jenkins_master_name }} cat /var/jenkins_home/secrets/initialAdminPassword
      register: jenkins_admin_password
      changed_when: false
      failed_when: false
      retries: 5
      delay: 3
      until: jenkins_admin_password.rc == 0

    - name: Show Password Admin
      ansible.builtin.debug:
        msg: "La password iniziale di Jenkins Admin è: {{ jenkins_admin_password.stdout }}"
      when: jenkins_admin_password.rc == 0

    # JENKINS AGENT
    - name: Avvio container Jenkins Agent
      community.docker.docker_container:
        name: "{{ jenkins_agent_name }}"
        image: "{{ jenkins_agent_image }}"
        state: started
        restart_policy: unless-stopped
        env:
          JENKINS_URL: "http://{{ jenkins_master_ip }}:8080"
          JENKINS_SECRET: "{{ jenkins_agent_secret }}"
          JENKINS_AGENT_NAME: "{{ jenkins_agent_name }}"
        networks:
          - name: "{{ docker_network_name }}"
            ipv4_address: "{{ jenkins_agent_ip }}"