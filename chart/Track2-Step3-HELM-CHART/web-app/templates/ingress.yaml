apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
spec:
  ingressClassName: traefik
  rules: 
  - host: formazionesou.local
    http:
      paths: 
        - path: /
          pathType: Prefix 
          backend: 
            service: 
              name: web-app-service
              port:
                number: 80